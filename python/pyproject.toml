[project]
name = "apiverve-worldwideearthquakes"
version = "1.2.5"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Worldwide Earthquakes tracks global seismic activity recorded over the past hour. It delivers magnitudes, epicenter coordinates and depth, location names, tsunami warning flags, USGS event links and 24-hour activity summaries sourced from the USGS. Filter by minimum magnitude; paid plans list the past 24 hours, search around any point, and add 7- and 30-day counts, the month's largest quake and daily history."
keywords = ["earthquake api", "live earthquake tracker", "worldwide seismic activity", "usgs earthquake data", "global earthquake monitor"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/earthquake?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/earthquake?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/earthquake-api"
Twitter = "https://twitter.com/apivervehq"
