openapi: 3.0.4
info:
  title: Worldwide Earthquakes
  description: >-
    Worldwide Earthquakes tracks global seismic activity recorded over the past
    hour. It delivers magnitudes, epicenter coordinates and depth, location
    names, tsunami warning flags, USGS event links and 24-hour activity
    summaries sourced from the USGS. Filter by minimum magnitude; paid plans
    list the past 24 hours, search around any point, and add 7- and 30-day
    counts, the month's largest quake and daily history.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/earthquake:
    get:
      summary: Worldwide Earthquakes
      description: >-
        Earthquake is a simple tool for getting earthquake data. It returns the
        earthquake data for the past hour.
      operationId: earthquake
      parameters:
        - name: period
          in: query
          schema:
            type: string
          required: false
          description: 'Time window: hour (the past hour) or day (the past 24 hours)'
          example: day
        - name: minMagnitude
          in: query
          schema:
            type: number
          required: false
          description: Only return earthquakes of at least this magnitude
          example: 2.5
        - name: lat
          in: query
          schema:
            type: number
          required: false
          description: >-
            Latitude to search around. With lon, returns only earthquakes within
            radius km, nearest first, each with distanceKm
          example: 34.05
        - name: lon
          in: query
          schema:
            type: number
          required: false
          description: Longitude to search around (use with lat)
          example: -118.24
        - name: radius
          in: query
          schema:
            type: number
          required: false
          description: Search radius in kilometers around lat/lon
          example: 250
        - name: daily
          in: query
          schema:
            type: boolean
          required: false
          description: >-
            Include one row per UTC day for the last 30 days: event count,
            largest magnitude and M4.5+ count
          example: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
